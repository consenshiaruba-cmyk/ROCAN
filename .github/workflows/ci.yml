# SPEC §15 Phase 1 / MOCK_TESTING §10: lint, typecheck, unit, integration and e2e on every push.
name: CI

on:
  # Branch pushes are covered by their pull request; only main runs on push.
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_ENV: test
  MOCK_MODE: '1'
  NEXT_TELEMETRY_DISABLED: '1'
  DATABASE_URL: postgres://rocan:rocan@localhost:5432/rocan
  S3_ENDPOINT: http://localhost:9000
  S3_REGION: us-east-1
  S3_ACCESS_KEY_ID: rocan
  S3_SECRET_ACCESS_KEY: rocan-dev-secret
  S3_FORCE_PATH_STYLE: '1'
  SMTP_URL: smtp://localhost:1025
  MAILPIT_API: http://localhost:8025
  PUBLIC_BASE_URL: http://localhost:3000

jobs:
  checks:
    name: Lint, typecheck, unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test:unit

  integration:
    name: Integration + e2e
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: rocan
          POSTGRES_PASSWORD: rocan
          POSTGRES_DB: rocan
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U rocan -d rocan"
          --health-interval 2s --health-timeout 3s --health-retries 30
      s3:
        image: rustfs/rustfs:1.0.1
        env:
          RUSTFS_ACCESS_KEY: rocan
          RUSTFS_SECRET_KEY: rocan-dev-secret
        ports: ['9000:9000']
        options: >-
          --health-cmd "curl -fsS http://localhost:9000/health"
          --health-interval 2s --health-timeout 3s --health-retries 30
      mailpit:
        image: axllent/mailpit:v1.31.4
        env:
          MP_SMTP_AUTH_ACCEPT_ANY: '1'
          MP_SMTP_AUTH_ALLOW_INSECURE: '1'
        ports: ['1025:1025', '8025:8025']
        options: >-
          --health-cmd "/mailpit readyz"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Storage buckets
        run: pnpm storage:init
      - name: Database reset + seed
        run: pnpm db:reset
      - name: Build
        run: pnpm build
      - name: Integration tests
        run: pnpm test:integration
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: E2E (mobile Chromium)
        run: pnpm test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
